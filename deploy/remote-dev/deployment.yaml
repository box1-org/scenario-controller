apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-controller-remote-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scenario-controller-remote-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenario-controller-remote-dev
      annotations:
        # Resolve "scenario-controller:remote-dev" from the sandbox ImageStream that Jib pushes to.
        alpha.image.policy.openshift.io/resolve-names: "*"
        box1.org/jvm-debug: enabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: scenario-controller:remote-dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUARKUS_LAUNCH_DEVMODE
              value: "true"
            # Dev Services would try to start Testcontainers inside the pod; dependencies are explicit here.
            - name: QUARKUS_DEVSERVICES_ENABLED
              value: "false"
            - name: QUARKUS_LIVE_RELOAD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scenario-controller-remote-dev-live-reload
                  key: password
            # JDWP on localhost only: attach with `box1-debug sandbox` (oc port-forward).
            - name: _JAVA_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp
            # Throwaway PostgreSQL in the sandbox (postgres.yaml), never the dev database.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://scenario-controller-remote-dev-postgres:5432/scenario_controller
            - name: QUARKUS_DATASOURCE_USERNAME
              value: scenario_controller
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scenario-controller-remote-dev-live-reload
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Liveness, not readiness: readiness may include dependencies (e.g. Kafka) that
          # are deliberately unreachable in the sandbox.
          readinessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            # Remote dev rewrites the application jars in place, so unlike the
            # Argo-managed Deployment the root filesystem stays writable here.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
