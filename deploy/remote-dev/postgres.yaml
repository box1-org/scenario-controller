# Throwaway PostgreSQL for remote dev in the sandbox: emptyDir storage, deleted with
# `box1-remote-dev delete`. Its password is the random per-sandbox value in the
# live-reload Secret that `box1-remote-dev deploy` creates; nothing is stored in Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-controller-remote-dev-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      box1.org/remote-dev-component: postgres
  template:
    metadata:
      labels:
        box1.org/remote-dev-component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15@sha256:95e94264e14133d80ddbc9980eeebf4806d6668a61cbc1917e57efa1941b516b
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: scenario_controller
            - name: POSTGRESQL_USER
              value: scenario_controller
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scenario-controller-remote-dev-live-reload
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRESQL_USER\" -d \"$POSTGRESQL_DATABASE\""]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scenario-controller-remote-dev-postgres
spec:
  selector:
    box1.org/remote-dev-component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
