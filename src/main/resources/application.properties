quarkus.application.name=scenario-controller
quarkus.http.host=0.0.0.0
greeting.prefix=${GREETING_PREFIX:Hello}
quarkus.smallrye-openapi.info-title=scenario-controller REST API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Named, bounded and audited demo scenarios and the Starfleet Feline Supply fixture set. Not a command runner.
# Jib pushes directly to the registry. Build/push are opt-in at build time.
quarkus.container-image.builder=jib
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:cfa544effa28c5c57197a4c9d460812e70efc0965e6f518e1c2e787ff3cb9335
quarkus.jib.platforms=linux/amd64
quarkus.jib.use-current-timestamp=false

# The catalog reads the deployed contract; Swagger uses the public HTTPS Route.
%prod.quarkus.smallrye-openapi.servers=${PUBLIC_API_URL:https://scenario-controller-dev.apps.ocp.box1.org}
quarkus.swagger-ui.always-include=true
# Allow Developer Hub's API Definition tester to call this service directly.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://developer-hub.apps.ocp.box1.org
quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST
quarkus.http.cors.headers=Accept,Authorization,Content-Type,traceparent
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.limits.max-body-size=4K
quarkus.jackson.fail-on-unknown-properties=true

# Audit store. The datasource URL, user and password come from the Deployment.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.additional-jdbc-properties.logServerErrorDetail=false
quarkus.datasource.health.enabled=false
scenario.readiness.database=true

# Safety gates (D-006). Both are required; anything missing fails closed.
scenario.control-enabled=${SCENARIO_CONTROL_ENABLED:false}
scenario.namespace=${POD_NAMESPACE:}
scenario.namespace-allowlist=${SCENARIO_NAMESPACE_ALLOWLIST:}
scenario.environment=${SCENARIO_ENVIRONMENT:unknown}

# Upstreams: fixed per service. No request field ever becomes a URL.
scenario.order-url=${ORDER_SERVICE_URL:http://order-service.order-service-dev.svc:8080}
scenario.inventory-url=${INVENTORY_SERVICE_URL:http://inventory-service.inventory-service-dev.svc:8080}
scenario.adapter-url=${FULFILLMENT_ADAPTER_URL:http://fulfillment-adapter.fulfillment-adapter-dev.svc:8080}
scenario.upstream-timeout=${SCENARIO_UPSTREAM_TIMEOUT:PT5S}
scenario.poll-interval=${SCENARIO_POLL_INTERVAL:PT2S}
scenario.expiry-interval=${SCENARIO_EXPIRY_INTERVAL:5s}
scenario.retention=${SCENARIO_AUDIT_RETENTION:P90D}
scenario.minimum-visible-delay=${SCENARIO_MINIMUM_VISIBLE_DELAY:PT60S}

# Inventory admin identity (client credentials, D-009). Unset means seeding and reset report it as not configured.
scenario.inventory-token.url=${INVENTORY_TOKEN_URL:none}
scenario.inventory-token.client-id=${INVENTORY_TOKEN_CLIENT_ID:none}
scenario.inventory-token.client-secret=${INVENTORY_TOKEN_CLIENT_SECRET:none}

# Inbound tokens (D-009): realm box1, audience scenario-controller, roles from this client's claim only.
quarkus.http.auth.proactive=false
quarkus.smallrye-jwt.blocking-authentication=true
mp.jwt.verify.issuer=${SCENARIO_JWT_ISSUER:https://keycloak.apps.ocp.box1.org/auth/realms/box1}
mp.jwt.verify.publickey.location=${SCENARIO_JWKS_URL:https://keycloak.apps.ocp.box1.org/auth/realms/box1/protocol/openid-connect/certs}
mp.jwt.verify.audiences=scenario-controller
smallrye.jwt.path.groups=resource_access/scenario-controller/roles
scenario.allowed-azp=${SCENARIO_ALLOWED_AZP:scenario-controller}

quarkus.otel.traces.exporter=none
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.additional-field."service.name".value=scenario-controller

quarkus.test.integration-test-profile=test
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/service}
%test.quarkus.datasource.username=${TEST_DATABASE_USERNAME:postgres}
%test.quarkus.datasource.password=${TEST_DATABASE_PASSWORD:postgres}
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.scheduler.enabled=false
%test.scenario.readiness.database=false
