apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: scenario-controller
  description: "A little whimsy for demos"
  annotations:
    github.com/project-slug: box1-org/scenario-controller
    backstage.io/kubernetes-id: scenario-controller
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/box1-org/scenario-controller/
    janus-idp.io/tekton: scenario-controller
    argocd/instance-name: openshift-gitops
    argocd/app-selector: backstage.io/kubernetes-id=scenario-controller
    box1.org/template-version: "1.1.0"
  tags: [java, quarkus, maven, tekton, gitops]
  links:
    - url: https://github.com/box1-org/scenario-controller
      title: Source Repository
      icon: github
    - url: https://scenario-controller-dev.apps.ocp.box1.org/q/swagger-ui/
      title: Swagger UI — test endpoints
      icon: code
    - url: https://scenario-controller-dev.apps.ocp.box1.org/q/openapi
      title: OpenAPI specification
      icon: code
    - url: https://scenario-controller-dev.apps.ocp.box1.org
      title: Application Route (after first release)
    - url: https://github.com/box1-org/box1-workloads-dev/tree/main/workloads/scenario-controller
      title: Desired deployment configuration
    - url: https://devspaces.apps.ocp.box1.org/#https://github.com/box1-org/scenario-controller
      title: Open in Dev Spaces
      icon: code
    # Add actual service-specific observability URLs
    # when dashboards and log views exist.
spec:
  type: service
  lifecycle: experimental
  owner: "user:default/mike4263"
  # Add when the corresponding System entity exists:
  # system: box1-demo
  providesApis:
    - scenario-controller-api
  consumesApis:
    - order-service-api
    - inventory-service-api
    - fulfillment-adapter-api
  dependsOn:
    - component:order-service
    - component:inventory-service
    - component:fulfillment-adapter
    - resource:scenario-controller-postgres
    - resource:keycloak-box1
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: scenario-controller-api
  description: OpenAPI contract for scenario-controller
  tags: [quarkus, openapi]
spec:
  type: openapi
  lifecycle: experimental
  owner: "user:default/mike4263"
  definition:
    $text: https://scenario-controller-dev.apps.ocp.box1.org/q/openapi
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: scenario-controller-postgres
  description: PostgreSQL database scenario_controller owned by scenario-controller (scenario-controller-dev namespace)
  tags: [postgresql, database]
  links:
    - url: https://github.com/box1-org/box1-workloads-dev/blob/main/workloads/scenario-controller/postgres.yaml
      title: Database manifest
spec:
  type: database
  lifecycle: experimental
  owner: "user:default/mike4263"
